name: Sync Portfolio Projects

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  sync-projects:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout portfolio repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync projects from GitHub
        working-directory: ./shrey-portfolio
        run: npm run sync:projects

      - name: Check for project changes
        id: changes
        run: |
          if git diff --quiet shrey-portfolio/src/data/projects.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated projects
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add shrey-portfolio/src/data/projects.json
          git commit -m "chore: sync portfolio projects"
          git push