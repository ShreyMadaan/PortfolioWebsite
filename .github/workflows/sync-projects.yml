name: Sync Portfolio Projects

on:
  # Allows manual execution from the GitHub Actions tab
  workflow_dispatch:

  # Automatically checks for project updates every 6 hours
  schedule:
    - cron: "0 */6 * * *"

# Required so GitHub Actions can commit the updated projects.json
permissions:
  contents: write

jobs:
  sync-projects:
    runs-on: ubuntu-latest

    steps:
      # 1. Download the Portfolio repository onto the GitHub runner
      - name: Checkout portfolio repository
        uses: actions/checkout@v4

      # 2. Install Node.js on the runner
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Run our GitHub project synchronization script
      - name: Sync projects from GitHub
        working-directory: ./shrey-portfolio
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run sync:projects

      # 4. Check whether projects.json actually changed
      - name: Check for project changes
        id: changes
        run: |
          if git diff --quiet shrey-portfolio/src/data/projects.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 5. Commit and push only when project data changed
      - name: Commit updated projects
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add shrey-portfolio/src/data/projects.json
          git commit -m "chore: sync portfolio projects"
          git push